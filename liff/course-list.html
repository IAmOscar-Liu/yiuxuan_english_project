<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>學習記錄</title>

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- LIFF SDK -->
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"
    ></script>

    <!-- Optional: tiny overrides to keep accordion clean -->
    <style>
      /* remove any residual borders/shadows from accordion bits */
      .accordion-item {
        border: 0 !important;
      }
      .accordion-button:focus {
        box-shadow: none !important;
      }
      .accordion-button:not(.collapsed) {
        box-shadow: none;
      }
    </style>
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <!-- Loading -->
      <div id="loading" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">載入中...</span>
        </div>
        <div class="mt-2">載入中，請稍候...</div>
      </div>

      <!-- Simple container (no card, no border) -->
      <section id="course-list-container" class="d-none">
        <h2 id="form-title" class="h5 fw-bold text-center mb-3">
          我的學習記錄
        </h2>

        <!-- Host where JS will render the accordion -->
        <div id="course-list"></div>
      </section>
    </main>

    <script type="module" src="./constants.js" defer></script>
    <script type="module" src="./course-list.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
